name: Raft simulator safety checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  election-safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and run election tests
        run: mvn --batch-mode --no-transfer-progress verify
